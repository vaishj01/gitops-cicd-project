apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker
  namespace: task-tracker
  labels:
    app: task-tracker
spec:
  replicas: 2                      # always keep 2 copies (pods) running
  selector:
    matchLabels:
      app: task-tracker            # manage pods that have this label
  template:                        # blueprint for each pod
    metadata:
      labels:
        app: task-tracker
    spec:
      containers:
        - name: task-tracker
          image: ghcr.io/vaishj01/task-tracker:817da3af47bdcfb703325c43bf84428a9ad32401
          imagePullPolicy: IfNotPresent   # use the image already loaded into kind
          ports:
            - containerPort: 8000
          resources:
            requests:              # minimum guaranteed
              cpu: 50m
              memory: 64Mi
            limits:                # maximum allowed
              cpu: 250m
              memory: 128Mi
          readinessProbe:          # "Is the pod ready to receive traffic?"
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:           # "Is the pod alive? If not, restart it"
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10